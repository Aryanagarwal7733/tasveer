<!DOCTYPE html>
<html>
<head>
<title>Click Test</title>
<style>
body { background: #111; color: #fff; font-family: Arial; padding: 40px; }
.btn { padding: 15px 30px; background: #f59e0b; color: #000; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin: 10px; }
#result { margin-top: 20px; padding: 20px; background: #1a1a2e; border-radius: 8px; font-size: 1.1rem; }
.sidebar { width: 200px; background: #0d0d12; padding: 20px; border-radius: 8px; display: inline-block; vertical-align: top; margin-right: 20px; }
.sidebar a { display: block; padding: 10px; color: #cbd5e1; text-decoration: none; border-radius: 6px; margin: 4px 0; }
.sidebar a:hover { background: rgba(245,158,11,0.2); color: #f59e0b; }
.sidebar a.active { background: #f59e0b; color: #000; font-weight: bold; }
.content { display: inline-block; vertical-align: top; padding: 20px; background: #0d0d12; border-radius: 8px; min-width: 300px; min-height: 200px; }
</style>
</head>
<body>
<h1>🧪 Tasveer Admin - Click Test Page</h1>
<p>Agar yahan click kaam kare toh browser theek hai:</p>

<button class="btn" onclick="document.getElementById('result').innerHTML = '✅ CLICK KAM KAR RAHA HAI! Time: ' + new Date().toLocaleTimeString()">TEST CLICK KRO</button>

<div id="result">Abhi click karo upar wale button pe...</div>

<br><br>
<h2>Sidebar Test:</h2>
<div class="sidebar">
  <a href="#" id="link-orders" onclick="showTab('orders'); return false;">📦 Orders</a>
  <a href="#" id="link-products" onclick="showTab('products'); return false;">🖼️ Products</a>
  <a href="#" id="link-customers" onclick="showTab('customers'); return false;">👥 Customers</a>
</div>
<div class="content" id="tab-content">
  Dashboard content — sidebar pe click karo
</div>

<script>
function showTab(name) {
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
  document.getElementById('link-' + name).classList.add('active');
  document.getElementById('tab-content').innerHTML = '✅ <b>' + name.toUpperCase() + '</b> tab kaam kar raha hai!<br>Time: ' + new Date().toLocaleTimeString();
}
// Auto test
console.log('Test page JS loaded OK');
setTimeout(function() {
  document.getElementById('result').innerHTML = '⚡ JS auto-running at: ' + new Date().toLocaleTimeString();
}, 1000);
</script>
</body>
</html>
